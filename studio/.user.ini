; Interpreter audio uploads — bulk intake of a whole city in one batch.
; A city is ~36 files; WAV interpreter clips can reach ~30 MB each
; (worst case 36 x ~100 MB), so the POST budget must hold them all.
; NOTE: max_file_uploads is PHP_INI_SYSTEM and CANNOT be set here — it
; lives in the php-fpm pool config (pool.d/www.conf), kept in sync there.
upload_max_filesize = 100M
post_max_size = 4096M
max_input_time = 600
max_execution_time = 600
